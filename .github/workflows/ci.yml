name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m py_compile run.py research/pipeline.py
      - name: JavaScript syntax
        run: node --check app.js
      - name: Static asset references
        run: python scripts/build_pages.py --check

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse PowerShell launchers
        shell: pwsh
        run: |
          $files = @('serve-ielts.ps1', '启动雅思训练器.ps1', 'keep-ielts-server.ps1', '停止雅思训练器.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw "$file failed to parse: $($errors[0].Message)" }
          }
