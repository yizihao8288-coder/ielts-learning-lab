<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ielts listening trainer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="input-panel" aria-labelledby="setup-title">
        <div class="brand-row">
          <div>
            <p class="eyebrow">Ielts listening</p>
            <h1 id="setup-title">英式单词练习</h1>
          </div>
          <div class="voice-pill" id="voiceStatus">检测语音中</div>
        </div>

        <div class="mode-tabs" role="radiogroup" aria-label="练习模式">
          <label class="mode-option">
            <input type="radio" name="quizMode" value="listening" checked />
            <span>
              <strong>听力模式</strong>
              <small>听后选词，并查看释义</small>
            </span>
          </label>
          <label class="mode-option">
            <input type="radio" name="quizMode" value="dictation" />
            <span>
              <strong>填空模式</strong>
              <small>例句挖空，手写单词</small>
            </span>
          </label>
          <label class="mode-option">
            <input type="radio" name="quizMode" value="reading" />
            <span>
              <strong>阅读模式</strong>
              <small>看例句，选择释义</small>
            </span>
          </label>
        </div>

        <label class="field-label" for="wordInput">单词列表</label>
        <textarea
          id="wordInput"
          spellcheck="false"
          placeholder="accommodation
environment
evidence
significant

每行一个单词，也可以用逗号或分号分隔。
无 API 时使用：word|中文释义|English example
例：category|类别；种类|The books are arranged by category, such as history, science, and literature."
        ></textarea>

        <div class="setup-grid">
          <label class="control">
            <span>选项数量</span>
            <select id="optionCount">
              <option value="4" selected>4</option>
              <option value="3">3</option>
              <option value="5">5</option>
              <option value="6">6</option>
            </select>
          </label>

          <label class="control">
            <span>语速</span>
            <input id="rateControl" type="range" min="0.65" max="1.1" step="0.05" value="0.85" />
          </label>

          <label class="control control-wide">
            <span>发音</span>
            <select id="voiceSelect"></select>
          </label>

          <label class="switch">
            <input id="autoSpeak" type="checkbox" checked />
            <span>自动朗读</span>
          </label>

          <label class="switch">
            <input id="skipFavoriteWords" type="checkbox" checked />
            <span>跳过收藏本</span>
          </label>
        </div>

        <div class="action-row">
          <button class="primary-button" id="startButton" type="button">
            <span class="button-icon" aria-hidden="true">▶</span>
            开始练习
          </button>
          <button class="secondary-button" id="saveTrainingButton" type="button">
            <span class="button-icon" aria-hidden="true">💾</span>
            保存训练
          </button>
          <button class="secondary-button" id="cleanKnownButton" type="button">
            <span class="button-icon" aria-hidden="true">✓</span>
            清理已会
          </button>
          <button class="secondary-button" id="sampleButton" type="button">
            <span class="button-icon" aria-hidden="true">＋</span>
            示例单词
          </button>
        </div>
        <p class="save-status" id="saveStatus" aria-live="polite"></p>

        <section class="book-panel" aria-labelledby="book-title">
          <div class="book-header">
            <div>
              <p class="eyebrow">History</p>
              <h2 id="book-title">收藏本</h2>
            </div>
            <div class="book-header-actions">
              <button class="secondary-button book-utility-button" id="exportDataButton" type="button">
                导出
              </button>
              <button class="secondary-button book-utility-button" id="importDataButton" type="button">
                导入
              </button>
              <button class="secondary-button book-review-button" id="bookReviewButton" type="button" disabled>
                <span class="button-icon" aria-hidden="true">↻</span>
                复习
              </button>
            </div>
          </div>
          <div class="book-tabs" role="tablist" aria-label="收藏本模式">
            <button class="book-tab active" type="button" data-book-tab="listening">
              听力 <span data-book-count="listening">0</span>
            </button>
            <button class="book-tab" type="button" data-book-tab="dictation">
              填空 <span data-book-count="dictation">0</span>
            </button>
            <button class="book-tab" type="button" data-book-tab="reading">
              阅读 <span data-book-count="reading">0</span>
            </button>
          </div>
          <div class="book-list" id="bookList" aria-live="polite"></div>
        </section>
      </section>

      <section class="quiz-panel" aria-labelledby="quiz-title">
        <div class="quiz-top">
          <div>
            <p class="eyebrow">Current round</p>
            <h2 id="quiz-title">等待开始</h2>
          </div>
          <button class="score-box" id="scoreBox" type="button" aria-label="查看本轮答对的单词">
            <span id="scoreValue">0</span>
            <small>正确</small>
          </button>
        </div>

        <div class="meter" aria-label="练习进度">
          <div id="progressBar"></div>
        </div>

        <div class="listening-stage" id="listeningStage">
          <div class="sound-orbit" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <p id="roundState">选择模式并输入单词后开始</p>
          <div class="blank-sentence" id="blankSentence" aria-live="polite"></div>
        </div>

        <div class="choice-grid" id="choices" role="list" hidden></div>

        <form class="answer-form" id="answerForm" hidden>
          <label class="sr-only" for="answerInput">填写缺失单词</label>
          <input
            id="answerInput"
            type="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="输入你听到的单词"
            disabled
          />
          <button class="primary-button" id="checkButton" type="submit" disabled>
            <span class="button-icon" aria-hidden="true">✓</span>
            检查
          </button>
        </form>

        <div class="quiz-actions">
          <button class="secondary-button" id="listenButton" type="button" disabled>
            <span class="button-icon" aria-hidden="true">🔊</span>
            朗读 / 重听
          </button>
          <button class="primary-button" id="nextButton" type="button" disabled>
            <span class="button-icon" aria-hidden="true">→</span>
            下一题
          </button>
        </div>

        <div class="review-panel" id="reviewPanel" aria-live="polite"></div>
      </section>
    </main>

    <div class="word-detail-backdrop" id="wordDetailDialog" role="dialog" aria-modal="true" aria-labelledby="wordDetailTitle" hidden>
      <article class="word-detail-card">
        <button class="word-detail-close" id="wordDetailClose" type="button" aria-label="关闭详情">×</button>
        <p class="eyebrow" id="wordDetailMeta">Word detail</p>
        <h2 id="wordDetailTitle"></h2>
        <dl class="word-detail-list">
          <div>
            <dt>中文释义</dt>
            <dd id="wordDetailZh"></dd>
          </div>
          <div>
            <dt>English definition</dt>
            <dd id="wordDetailEn"></dd>
          </div>
          <div>
            <dt>Example sentence</dt>
            <dd id="wordDetailExample"></dd>
          </div>
          <div>
            <dt>上次答案</dt>
            <dd id="wordDetailResponse"></dd>
          </div>
        </dl>
        <div class="word-detail-actions">
          <button class="primary-button" id="wordDetailSpeakWord" type="button">
            <span class="button-icon" aria-hidden="true">🔊</span>
            再读单词
          </button>
          <button class="secondary-button" id="wordDetailSpeakExample" type="button">
            <span class="button-icon" aria-hidden="true">▶</span>
            读例句
          </button>
        </div>
        <p class="word-detail-status" id="wordDetailStatus" aria-live="polite"></p>
      </article>
    </div>

    <script src="app.js"></script>
  </body>
</html>
